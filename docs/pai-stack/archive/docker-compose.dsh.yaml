# pai-stack — Custom DSH Override (Built from Official DSH Binary)
#
# This compose file uses the custom Dockerfile that builds DSH layer by layer
# from the official @deepseek-ai/dsh npm package, avoiding the upstream
# dsh-docker-server image and its host/container mapping decisions.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.dsh.yaml --profile dsh up -d --build
#
# Key architectural differences from docker-compose.dsh.yaml:
#
# 1. DSH PROGRAM IN IMAGE, NOT VOLUME
#    - No dsh_programs volume — DSH is baked into the image at /usr/local/bin/dsh
#    - Version pinned at build time via DSH_VERSION build arg
#    - Immutable, reproducible, no first-boot seed copy
#
# 2. HOST UID/GID MAPPING (not fixed uid 1000)
#    - TARGET_UID/TARGET_GID build args default to host UID/GID
#    - Compose `user:` runs PID 1 as that user from the start (no setpriv)
#    - Fresh named volumes inherit the image-baked ownership; `make dsh-perms`
#      chowns pre-existing volumes once. No per-boot chown -R.
#
# 3. WORKSPACE AT SHARED PATH
#    - Mounted at /opt/data/workspace (same path Hermes uses)
#    - DSH_HOME at /data/dsh (separate from workspace)
#    - Sessions operate directly on /opt/data/workspace/<project>, so Hermes
#      and DSH share the same filepath; nothing ever chowns this bind
#      (host files keep ownership)
#
# 4. TOOLCHAIN CACHES ON NAMED VOLUME (not in workspace)
#    - dsh_toolchains volume at /data/dsh/home/.cache ($HOME/.cache)
#    - Keeps build artifacts out of the shared workspace
#    - Survives container rebuilds (volume root IS the .cache content)
#
# 5. DOCKER SOCKET (host daemon reuse)
#    - /var/run/docker.sock mounted :ro + `group_add: [DOCKER_GID]`
#      (Desktop = 0/root, Linux = docker gid via Makefile auto-detect)
#    - `user:` preserves supplementary groups (setpriv --init-groups did not,
#      which is why the old socat proxy socket existed — now deleted)
#    - Lets DSH restart pai-stack services and spin up project containers
#
# 6. SKILLS MOUNT AT DSH_AGENTS_HOME
#    - ./skills → /data/dsh/.agents/skills (read-only)
#    - DSH_AGENTS_HOME=/data/dsh/.agents (required for skill discovery)

services:
  dsh:
    build:
      context: ./dsh
      dockerfile: Dockerfile
      args:
        # DSH version to install from npm
        DSH_VERSION: ${DSH_VERSION:-0.2.0-rc.2}
        # Host UID/GID for permission mapping (auto-detected by Makefile)
        TARGET_UID: ${UID:-1000}
        TARGET_GID: ${GID:-1000}
        # Whether to install Docker CLI and mount socket
        WITH_DOCKER_SOCKET: ${DSH_WITH_DOCKER_SOCKET:-true}
        # Base image (can use node:24-slim, node:24-alpine, etc.)
        BASE_IMAGE: ${DSH_BASE_IMAGE:-node:24-slim}
        # Auth plugin (@xgone/dsh-remote) — matches upstream default
        WITH_REMOTE_PLUGIN: ${DSH_WITH_REMOTE_PLUGIN:-true}
        REMOTE_PLUGIN_VERSION: ${DSH_REMOTE_PLUGIN_VERSION:-0.3.5}
        REMOTE_PLUGIN_NAME: ${DSH_REMOTE_PLUGIN_NAME:-@xgone/dsh-remote}
        # Memory plugin (dsh-mnemon) — tools surface as mnemon_*
        WITH_MNEMON_PLUGIN: ${DSH_WITH_MNEMON_PLUGIN:-true}
        MNEMON_PLUGIN_VERSION: ${DSH_MNEMON_PLUGIN_VERSION:-0.5.24}
        MNEMON_PLUGIN_NAME: ${DSH_MNEMON_PLUGIN_NAME:-dsh-mnemon}
        # Durable automation plugin (@michengai/dsh-automation) — joint seed
        # tree built in the final image stage (no toolchain rebuild)
        WITH_AUTOMATION_PLUGIN: ${DSH_WITH_AUTOMATION_PLUGIN:-true}
        AUTOMATION_PLUGIN_VERSION: ${DSH_AUTOMATION_PLUGIN_VERSION:-0.1.54}
        AUTOMATION_PLUGIN_NAME: ${DSH_AUTOMATION_PLUGIN_NAME:-@michengai/dsh-automation}
        # First-party Telegram plugin (in-repo plugins/dsh-pai-telegram,
        # joint tree built in final; no registry, no version to pin)
        WITH_TELEGRAM_PLUGIN: ${DSH_WITH_TELEGRAM_PLUGIN:-true}
        TELEGRAM_PLUGIN_NAME: dsh-pai-telegram
    image: ${DSH_IMAGE:-pai-stack-dsh:custom}
    container_name: dsh
    restart: unless-stopped
    # Session cwd: the sandbox policy sets workspaceRoot = process.cwd()
    # (verified via `dsh --profile web --dump-config`), so the web UI starts
    # in the shared workspace — same filepaths Hermes sees.
    working_dir: /opt/data/workspace
    profiles:
      - dsh
    depends_on:
      llm-gateway:
        condition: service_healthy
    environment:
      # DSH home directory (sessions, configs, plugins, memory)
      DSH_HOME: /data/dsh
      # Writable home on the data volume (NOT the read-only image layer:
      # pnpm and toolchain caches need a writable HOME; session cwd comes
      # from working_dir above, not from $HOME)
      HOME: /data/dsh/home
      # Skills root — required for dsh-skill-filesystem plugin
      # Points at the mount target, not the host path
      DSH_AGENTS_HOME: /data/dsh/.agents
      # LLM Gateway (same as Hermes)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env (mirrors OPENAI_COMPATIBLE_API_KEY)}
      DEEPSEEK_BASE_URL: http://llm-gateway:4000/v1
      OPENAI_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-not-needed}
      OPENAI_BASE_URL: http://llm-gateway:4000/v1
      # Auth: @xgone/dsh-remote plugin pre-installed in image, seeded on first boot
      # Admin user + random 16-char password (printed once in logs via make dsh-password)
      DSH_SETUP_REMOTE: ${DSH_SETUP_REMOTE:-on}
      # Automation tasks: official experimental schedule bundle (ships in the
      # image, enabled by appending it to the web profile bundles — no install).
      # "false" leaves the shipped composition untouched.
      DSH_WITH_SCHEDULE: ${DSH_WITH_SCHEDULE:-true}
      # Durable automation (cron that fires with no chat open). "false" skips
      # the seed install; the joint tree stays available in the image.
      DSH_WITH_AUTOMATION: ${DSH_WITH_AUTOMATION:-true}
      # First-party Telegram poller (dsh-pai-telegram seed). "false" skips
      # the seed install; the joint tree stays available in the image.
      DSH_WITH_TELEGRAM: ${DSH_WITH_TELEGRAM:-true}
      DSH_DEFAULT_ADMIN_USER: ${DSH_DEFAULT_ADMIN_USER:-admin}
      DSH_ADMIN_PASSWORD: ${DSH_ADMIN_PASSWORD:-}
      # Telegram — separate DSH bot (see .env.example §9). DSH_TELEGRAM_TOKEN
      # kept as alias for the planned first-party notifier; falls back to
      # legacy shared TELEGRAM_BOT_TOKEN for pre-rename .env files.
      DSH_TELEGRAM_TOKEN: ${DSH_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      DSH_TELEGRAM_BOT_TOKEN: ${DSH_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      DSH_TELEGRAM_ALLOWED_USERS: ${DSH_TELEGRAM_ALLOWED_USERS:-${TELEGRAM_ALLOWED_USERS:-}}
      DSH_TELEGRAM_GROUP_ALLOWED_USERS: ${DSH_TELEGRAM_GROUP_ALLOWED_USERS:-${TELEGRAM_GROUP_ALLOWED_USERS:-}}
      DSH_TELEGRAM_GROUP_ALLOWED_CHATS: ${DSH_TELEGRAM_GROUP_ALLOWED_CHATS:-${TELEGRAM_GROUP_ALLOWED_CHATS:-}}
      # Trusted hosts for LAN/DNS access (if DSH_BIND_IP=0.0.0.0)
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      OD_API_TOKEN: ${OD_API_TOKEN:-}
      # Timezone
      TZ: ${TZ:-Asia/Shanghai}
      # Node.js memory limit
      NODE_OPTIONS: --max-old-space-size=${NODE_MAX_OLD_SPACE:-1024}
      # Disable native cache (use volume instead)
      NARB_DISABLE_NATIVE_CACHE: 1
      # Docker CLI talks to the mounted host socket directly
      # (no DOCKER_HOST override, no proxy socket).
      DOCKER_CONFIG: /data/dsh/home/.docker
      # Directory-picker start directory (see Dockerfile patch): the
      # "Select Workspace Directory" dialog opens here instead of $HOME.
      # Same path as the workspace mount below — no extra vars.
      WORKSPACE_DIR: /opt/data/workspace
    ports:
      # Host port 9229 → container port 3080 (socat forwards to 3081)
      - "${DSH_BIND_IP:-127.0.0.1}:${DSH_PORT:-9229}:3080"
    volumes:
      # DSH data volume: sessions, configs, plugins, memory, mnemon DB
      - dsh_data:/data/dsh
      # Toolchain caches volume: Go, Rust, uv, pip caches (the volume root
      # IS the .cache content, kept out of the shared workspace)
      - dsh_toolchains:/data/dsh/home/.cache
      # Workspace bind mount at the shared path (same as Hermes), so both
      # agents see identical filepaths (/opt/data/workspace/<project>)
      - type: bind
        source: "${WORKSPACE_DIR}"
        target: /opt/data/workspace
        read_only: false
        bind:
          create_host_path: false
      # Skills mount (read-only)
      - type: bind
        source: ./skills
        target: /data/dsh/.agents/skills
        read_only: true
      # Docker socket: host daemon reuse so DSH can restart services
      # and spin up project containers. :ro is mount mode only — the
      # socket API still works (same as hermes).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Run as the host user from PID 1 (no setpriv dance). Supplementary
    # groups from group_add are preserved, giving socket access.
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    # Security hardening (no extra caps: no chown, no setpriv, no proxy)
    read_only: true
    tmpfs:
      - /tmp:size=128m,exec
      - /run:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3081,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  # DSH data: sessions, configs, plugins, memory (mnemon SQLite)
  dsh_data:
  # Toolchain caches: Go, Rust, uv, pip (kept out of workspace)
  dsh_toolchains: