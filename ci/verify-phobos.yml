name: Verify Phobos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: make check
      - run: node --check src/phobos/static/dashboard.js
      - run: uv run phobos init
      - run: docker compose -p phobos --profile telegram config --quiet
      - run: docker compose -p phobos build api
      - run: uv run python scripts/smoke-compose.py
