[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "phobos-agent"
version = "0.1.0"
description = "A self-hosted personal AI helper with durable tickets and inspectable memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "uvicorn>=0.34,<1",
  "graphifyy==0.9.97",
]

[project.scripts]
phobos = "phobos.cli:main"

[project.optional-dependencies]
transcription = ["faster-whisper>=1.2,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/phobos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["hermes", "dsh", "terrain", "opendesign", "llm-gateway", "skills", "scripts/check-dsh-versions.py", "scripts/push-dsh-models.py", "scripts/sync-models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

